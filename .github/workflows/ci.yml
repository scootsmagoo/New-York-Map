name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    # Pinned: ubuntu-latest moves to 26 from 2026-10-19, and Playwright's
    # --with-deps install needs an OS it knows.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Browser tests against the build; a failure stops the deploy.
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
