name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    # Playwright's own image has the browsers and the system libraries they
    # need, so nothing comes from Ubuntu's package mirror (which once took
    # 9 minutes for --with-deps). The tag must match @playwright/test;
    # src/lib/__tests__/ci.test.ts checks.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Browser tests against the build; a failure stops the deploy.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
